# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile built two shared libraries (libexcept.so from lib/except.c and
# libexceptcc.so from lib/exceptcc.cc, -shared -fpic -ldl) and four test
# binaries, two of which link the libraries. That multi-object, lib-before-tests
# link is beyond the single-file C processor, so scripts/build_except.py runs
# the exact sequence. (The Makefile's install target was a separate `sudo
# install` to /usr -- a deploy action, not a build.)
[processor.explicit.except]
command = "scripts/build_except.py"
input_globs = ["lib/*.c", "lib/*.cc", "lib/*.h", "test/*.c", "test/*.cc"]
output_files = [
    "libexcept.so",
    "libexceptcc.so",
    "test/test_link.elf",
    "test/test_linkcc.elf",
    "test/test_nolink.elf",
    "test/test_nolinkcc.elf",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
